name: CI

# 仓库是私有 + GitHub Actions 额度敏感（2026-09-06 PM 决策）：
# 自动触发 (`pull_request:` / `push:`) 改 manual `workflow_dispatch`，
# 不消耗云端额度。契约定义保留——multi-agent-orchestration、
# pm-closeout、CODEOWNERS 仍能机读 .github/workflows/ci.yml 的 verify 锚点。
# 本地实时验证：`pnpm typecheck && pnpm test && pnpm build`（已验证 typecheck/test 全绿）。
# 想在 GitHub UI 跑全套验证：手动点 Actions → CI → Run workflow（不自动消费额度）。

on:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # 堆上限与本机一致——主仓 package.json 已注入
      - run: NODE_OPTIONS=--max-old-space-size=2048 pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
